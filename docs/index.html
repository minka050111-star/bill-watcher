<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대외협력 데일리 브리핑</title>
<style>
  @font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-ExtraBold.woff2') format('woff2');
    font-weight: 800;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoSmallFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoSmallSans-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoSmallFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoSmallSans-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  :root {
    --ink: #3E3A39;
    --paper: #FFFFFF;
    --outer: #F4F3F1;
    --accent: #FFCD00;
    --accent-ink: #3E3A39;
    --accent-text: #96730A;
    --flag: #E2574C;
    --text: #3E3A39;
    --muted: #8C8883;
    --line: #EBE9E5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--outer);
    color: var(--text);
    font-family: 'KakaoSmallFont', -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .sheet {
    max-width: 760px;
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
    padding: 56px 40px 80px;
  }
  header.brief-head {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 36px;
  }
  header.brief-head .kicker {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 4px 10px;
    border-radius: 4px;
    margin: 0 0 14px;
  }
  header.brief-head h1 {
    font-family: 'KakaoBigFont', -apple-system, sans-serif;
    font-size: 30px;
    font-weight: 800;
    margin: 0 0 8px;
    color: var(--ink);
  }
  header.brief-head .date {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
  }
  section.block {
    margin-bottom: 44px;
  }
  section.block h2 {
    font-family: 'KakaoBigFont', -apple-system, sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    margin: 0 0 4px;
  }
  section.block .section-sub {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 18px;
  }
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .row {
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }
  .row:last-child {
    border-bottom: 1px solid var(--line);
  }
  .list--tight .row {
    padding: 10px 0;
  }
  /* 뉴스 "더 보기" 접기 */
  details.more-toggle {
    margin-top: 2px;
  }
  details.more-toggle summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-text);
    padding: 12px 0;
    list-style: none;
  }
  details.more-toggle summary::-webkit-details-marker {
    display: none;
  }
  details.more-toggle summary::after {
    content: ' ▾';
  }
  details.more-toggle[open] summary::after {
    content: ' ▴';
  }
  .row-title {
    display: block;
    font-size: 15.5px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    line-height: 1.4;
  }
  a.row-title:hover {
    color: var(--accent-text);
  }
  .row-desc {
    font-size: 13.5px;
    color: var(--muted);
    margin: 6px 0 0;
    line-height: 1.5;
  }
  .row-meta {
    font-size: 12.5px;
    color: var(--muted);
    margin: 6px 0 0;
  }
  .row-tag {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-text);
    margin: 4px 0 0;
  }
  /* 뉴스 카테고리 탭 */
  .news-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }
  .news-tab {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .news-tab--active {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }
  .tab-count {
    opacity: 0.7;
  }
  .empty {
    font-size: 13.5px;
    color: var(--muted);
    padding: 14px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  /* 달력 */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-grid--header {
    margin-bottom: 6px;
  }
  .cal-dayname {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding-bottom: 4px;
  }
  .cal-day {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--line);
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-day-num {
    font-size: 13px;
    color: var(--text);
  }
  .cal-day--muted .cal-day-num {
    color: var(--line);
  }
  .cal-day--today {
    border-color: var(--ink);
    border-width: 2px;
  }
  .cal-day--flagged {
    border-color: var(--flag);
    border-width: 2px;
    background: #FDECEA;
  }
  .cal-day--flagged .cal-dot {
    background: var(--flag);
  }
  .cal-day--selected {
    background: var(--ink);
  }
  .cal-day--selected .cal-day-num {
    color: var(--paper);
  }
  .cal-dot {
    position: absolute;
    bottom: 5px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  .cal-day--selected .cal-dot {
    background: var(--paper);
  }
  mark.hl {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 0 2px;
    border-radius: 2px;
  }
  .cal-detail {
    margin-top: 20px;
  }
  .cal-detail-date {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 8px;
  }
  /* 일정 상세: 종류별 병행 배치 */
  .cal-kind-columns {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
  }
  .cal-kind-col {
    flex: 1 1 200px;
    min-width: 180px;
  }
  .cal-kind-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 2px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
  }
  .cal-kind-count {
    font-weight: 400;
    color: var(--muted);
  }
  footer.brief-foot {
    margin-top: 56px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>

 class=\"row-desc\">&#x27;ECO Life&#x27;(공유 모빌리티, 철도, 전기차 충전소, 전자도서, 친환경 쇼핑 등), &#x27;Healthy Plan&#x27;(피트니스센터... 스페셜 서비스팩은 △타기(Ride) 영역의 카카오T 바이크 50% 결제일 할인 △느끼기(Feel) 영역의 YES24·NOL티켓 20%, CGV...</p></li><li class=\"row\"><a class=\"row-title\" href=\"https://www.womentimes.co.kr/news/articleView.html?idxno=106650\" target=\"_blank\" rel=\"noopener\">신한카드, 박보검 손그림 담은 에코 플랜 카드 출시</a><p class=\"row-desc\">▲&#x27;ECO Life&#x27;(공유 모빌리티, 철도, 전기차 충전소, 전자도서, 친환경 쇼핑 등) ▲&#x27;Healthy Plan&#x27;(피트니스센터... 서비스팩은 결제일 할인 혜택으로, ▲타기(Ride) 영역의 카카오T 바이크 50% ▲느끼기(Feel) 영역의 YES24...</p></li><li class=\"row\"><a class=\"row-title\" href=\"http://www.srtimes.kr/news/articleView.html?idxno=213697\" target=\"_blank\" rel=\"noopener\">신한카드, 프리지아 향 담은 &#x27;에코 플랜 박보검 에디션&#x27; 단독 출시</a><p class=\"row-desc\">이외에도 ▲공유 모빌리티, 전기차 충전소 등 &#x27;ECO Life&#x27; ▲피트니스센터, 그린푸드 등 &#x27;Healthy Plan&#x27; ▲편의점... 카카오T 바이크 50% 할인, 영화 및 전시 관람 최대 50% 할인, 이마트·동구밭 등 제휴처 10% 할인 등으로...</p></li>", "기타": "<li class=\"row\"><a class=\"row-title\" href=\"https://www.newsworks.co.kr/news/articleView.html?idxno=855260\" target=\"_blank\" rel=\"noopener\">현대차, &#x27;플레오스 커넥트&#x27; 앱 공모전 대상에 &#x27;창밖동화&#x27; 선정</a><p class=\"row-desc\">현대차는 지난 6월 26일부터 7월 5일까지 부산모빌리티쇼에서 플레오스 커넥트가 탑재된 디 올 뉴 아반떼와... 실제로 플레오스 커넥트의 앱 마켓에는 최근 멜론·카카오내비 등이 추가돼 국내 제공 앱이 총 18종으로...</p></li><li class=\"row\"><a class=\"row-title\" href=\"https://kpenews.com/View.aspx?No=4248016\" target=\"_blank\" rel=\"noopener\">전국민 AI 서비스 시동..SKT·카카오·KT, ‘모두의 AI’ 출사표</a><p class=\"row-desc\">아울러 의료 플랫폼 굿닥과 모빌리티 플랫폼 티맵 등 8개 생활 특화 파트너 서비스를 결합한다. 병원 검색과 대기 인원 확인부터 티맵 길안내까지 단일 시나리오로 완결하는 편의성을 제공하기 위해서다. 카카오...</p></li>", "IPO·상장": "<li class=\"row\"><a class=\"row-title\" href=\"https://www.edaily.co.kr/News/Read?newsId=04159046645583072&amp;mediaCodeNo=257&amp;utm_source=naver&amp;utm_medium=referral&amp;utm_campaign=news_syndication&amp;utm_content=original_article\" target=\"_blank\" rel=\"noopener\">자회사 상장, 누구를 위한 것인가…카카오가 던진 &#x27;주주가치&#x27;</a><p class=\"row-desc\">자회사를 증시에 올려 재무적투자자(FI)의 투자금을 회수하는 것이 모회사 일반주주에게도 이익일까. 카카오가 카카오모빌리티의 미국 주식예탁증서(ADR) 상장안에 제동을 걸면서 자회사 상장과 ‘주주가치’의 관계가...</p></li><li class=\"row\"><a class=\"row-title\" href=\"https://www.investchosun.com/site/data/html_dir/2026/09/23/2026092380049.html\" target=\"_blank\" rel=\"noopener\">[Invest]카모 ADR 막은 카카오 이사회…중복상장 넘을 ‘주주보호책’ 없...</a><p class=\"row-desc\">카카오 이사회가 카카오모빌리티의 미국 주식예탁증서(ADR) 상장에 반대하면서 관련 절차도 사실상 중단 수순에 들어갔다. 카카오모빌리티 2대 주주인 글로벌 사모펀드(PEF) 운용사 TPG가 상장을 주도해왔지만, 모회사인...</p></li>"};
  function showNewsCategory(cat) {
    document.querySelectorAll('.news-tab').forEach(function(b) {
      b.classList.toggle('news-tab--active', b.dataset.cat === cat);
    });
    document.getElementById('news-detail').innerHTML = newsByCategory[cat] || '';
  }
  showNewsCategory('IPO·상장');
</script>

    <section class="block">

  const highlightKeywords = ["플랫폼", "특고", "노동자", "배달", "카카오", "모빌리티", "자율주행"];

  function escHtml(s) {
    return String(s).replace(/</g, '&lt;');
  }

  function highlightText(s) {
    let out = escHtml(s);
    highlightKeywords.forEach(function(kw) {
      if (!kw) return;
      const escapedKw = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      out = out.replace(new RegExp(escapedKw, 'g'), '<mark class="hl">' + kw + '</mark>');
    });
    return out;
  }

  function eventLine(e) {
    let line = '';
    if (e.time) line += e.time + ' ';
    line += e.content;
    if (e.committee) line += ' (' + e.committee + ')';
    if (e.place) line += ' @ ' + e.place;
    return line;
  }

  function showScheduleDay(dateStr) {
    document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('cal-day--selected'));
    const btn = document.querySelector('.cal-day[data-date="' + dateStr + '"]');
    if (btn) btn.classList.add('cal-day--selected');

    const events = scheduleData[dateStr] || [];
    const detail = document.getElementById('cal-detail');
    const [y, m, d] = dateStr.split('-');
    let html = '<p class="cal-detail-date">' + y + '년 ' + parseInt(m) + '월 ' + parseInt(d) + '일</p>';

    if (events.length === 0) {
      html += '<p class="empty">이 날짜에 예정된 일정이 없습니다.</p>';
    } else {
      // 종류(국회행사/위원회/본회의 등)별로 묶는다
      const groups = {};
      const order = [];
      events.forEach(function(e) {
        const k = e.kind || '일정';
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(e);
      });

      html += '<div class="cal-kind-columns">';
      order.forEach(function(k) {
        html += '<div class="cal-kind-col">';
        html += '<p class="cal-kind-title">' + escHtml(k) + ' <span class="cal-kind-count">' + groups[k].length + '</span></p>';
        html += '<ul class="list list--tight">';
        groups[k].forEach(function(e) {
          html += '<li class="row"><p class="row-desc">' + highlightText(eventLine(e)) + '</p></li>';
        });
        html += '</ul></div>';
      });
      html += '</div>';
    }
    detail.innerHTML = html;
  }
  showScheduleDay('2026-10-01');
</script>
