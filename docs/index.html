<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대외협력 데일리 브리핑</title>
<style>
  @font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-ExtraBold.woff2') format('woff2');
    font-weight: 800;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoSmallFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoSmallSans-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoSmallFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoSmallSans-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  :root {
    --ink: #3E3A39;
    --paper: #FFFFFF;
    --outer: #F4F3F1;
    --accent: #FFCD00;
    --accent-ink: #3E3A39;
    --accent-text: #96730A;
    --flag: #E2574C;
    --text: #3E3A39;
    --muted: #8C8883;
    --line: #EBE9E5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--outer);
    color: var(--text);
    font-family: 'KakaoSmallFont', -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .sheet {
    max-width: 760px;
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
    padding: 56px 40px 80px;
  }
  header.brief-head {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 36px;
  }
  header.brief-head .kicker {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 4px 10px;
    border-radius: 4px;
    margin: 0 0 14px;
  }
  header.brief-head h1 {
    font-family: 'KakaoBigFont', -apple-system, sans-serif;
    font-size: 30px;
    font-weight: 800;
    margin: 0 0 8px;
    color: var(--ink);
  }
  header.brief-head .date {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
  }
  section.block {
    margin-bottom: 44px;
  }
  section.block h2 {
    font-family: 'KakaoBigFont', -apple-system, sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    margin: 0 0 4px;
  }
  section.block .section-sub {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 18px;
  }
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .row {
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }
  .row:last-child {
    border-bottom: 1px solid var(--line);
  }
  .list--tight .row {
    padding: 10px 0;
  }
  /* 뉴스 "더 보기" 접기 */
  details.more-toggle {
    margin-top: 2px;
  }
  details.more-toggle summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-text);
    padding: 12px 0;
    list-style: none;
  }
  details.more-toggle summary::-webkit-details-marker {
    display: none;
  }
  details.more-toggle summary::after {
    content: ' ▾';
  }
  details.more-toggle[open] summary::after {
    content: ' ▴';
  }
  .row-title {
    display: block;
    font-size: 15.5px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    line-height: 1.4;
  }
  a.row-title:hover {
    color: var(--accent-text);
  }
  .row-desc {
    font-size: 13.5px;
    color: var(--muted);
    margin: 6px 0 0;
    line-height: 1.5;
  }
  .row-meta {
    font-size: 12.5px;
    color: var(--muted);
    margin: 6px 0 0;
  }
  .row-tag {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-text);
    margin: 4px 0 0;
  }
  /* 뉴스 카테고리 탭 */
  .news-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }
  .news-tab {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .news-tab--active {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }
  .tab-count {
    opacity: 0.7;
  }
  .empty {
    font-size: 13.5px;
    color: var(--muted);
    padding: 14px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  /* 달력 */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-grid--header {
    margin-bottom: 6px;
  }
  .cal-dayname {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding-bottom: 4px;
  }
  .cal-day {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--line);
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-day-num {
    font-size: 13px;
    color: var(--text);
  }
  .cal-day--muted .cal-day-num {
    color: var(--line);
  }
  .cal-day--today {
    border-color: var(--ink);
    border-width: 2px;
  }
  .cal-day--flagged {
    border-color: var(--flag);
    border-width: 2px;
    background: #FDECEA;
  }
  .cal-day--flagged .cal-dot {
    background: var(--flag);
  }
  .cal-day--selected {
    background: var(--ink);
  }
  .cal-day--selected .cal-day-num {
    color: var(--paper);
  }
  .cal-dot {
    position: absolute;
    bottom: 5px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  .cal-day--selected .cal-dot {
    background: var(--paper);
  }
  mark.hl {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 0 2px;
    border-radius: 2px;
  }
  .cal-detail {
    margin-top: 20px;
  }
  .cal-detail-date {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 8px;
  }
  /* 일정 상세: 종류별 병행 배치 */
  .cal-kind-columns {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
  }
  .cal-kind-col {
    flex: 1 1 200px;
    min-width: 180px;
  }
  .cal-kind-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 2px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
  }
  .cal-kind-count {
    font-weight: 400;
    color: var(--muted);
  }
  footer.brief-foot {
    margin-top: 56px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>

  function showNewsCategory(cat) {
    document.querySelectorAll('.news-tab').forEach(function(b) {
      b.classList.toggle('news-tab--active', b.dataset.cat === cat);
    });

  }
  showNewsCategory('자율주행');
</script>

    <section class="block">

)"}], "2026-11-01": [{"kind": "기자회견", "time": "14:11", "content": "국민의힘 최보윤 의원(수석대변인) 브리핑", "committee": "", "place": ""}, {"kind": "기자회견", "time": "13:59", "content": "주진우 의원 기자회견", "committee": "", "place": ""}]};
  const highlightKeywords = ["플랫폼", "특고", "노동자", "배달", "카카오", "모빌리티", "자율주행"];

  function escHtml(s) {
    return String(s).replace(/</g, '&lt;');
  }

  function highlightText(s) {
    let out = escHtml(s);
    highlightKeywords.forEach(function(kw) {
      if (!kw) return;
      const escapedKw = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      out = out.replace(new RegExp(escapedKw, 'g'), '<mark class="hl">' + kw + '</mark>');
    });
    return out;
  }

  function eventLine(e) {
    let line = '';
    if (e.time) line += e.time + ' ';
    line += e.content;
    if (e.committee) line += ' (' + e.committee + ')';
    if (e.place) line += ' @ ' + e.place;
    return line;
  }

  function showScheduleDay(dateStr) {
    document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('cal-day--selected'));
    const btn = document.querySelector('.cal-day[data-date="' + dateStr + '"]');
    if (btn) btn.classList.add('cal-day--selected');

    const events = scheduleData[dateStr] || [];
    const detail = document.getElementById('cal-detail');
    const [y, m, d] = dateStr.split('-');
    let html = '<p class="cal-detail-date">' + y + '년 ' + parseInt(m) + '월 ' + parseInt(d) + '일</p>';

    if (events.length === 0) {
      html += '<p class="empty">이 날짜에 예정된 일정이 없습니다.</p>';
    } else {
      // 종류(국회행사/위원회/본회의 등)별로 묶는다
      const groups = {};
      const order = [];
      events.forEach(function(e) {
        const k = e.kind || '일정';
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(e);
      });

      html += '<div class="cal-kind-columns">';
      order.forEach(function(k) {
        html += '<div class="cal-kind-col">';
        html += '<p class="cal-kind-title">' + escHtml(k) + ' <span class="cal-kind-count">' + groups[k].length + '</span></p>';
        html += '<ul class="list list--tight">';
        groups[k].forEach(function(e) {
          html += '<li class="row"><p class="row-desc">' + highlightText(eventLine(e)) + '</p></li>';
        });
        html += '</ul></div>';
      });
      html += '</div>';
    }
    detail.innerHTML = html;
  }
  showScheduleDay('2026-11-20');
