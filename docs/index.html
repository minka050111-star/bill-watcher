<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대외협력 데일리 브리핑</title>
<style>
  @font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-ExtraBold.woff2') format('woff2');
    font-weight: 800;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoSmallFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoSmallSans-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoSmallFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoSmallSans-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  :root {
    --ink: #3E3A39;
    --paper: #FFFFFF;
    --outer: #F4F3F1;
    --accent: #FFCD00;
    --accent-ink: #3E3A39;
    --accent-text: #96730A;
    --flag: #E2574C;
    --text: #3E3A39;
    --muted: #8C8883;
    --line: #EBE9E5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--outer);
    color: var(--text);
    font-family: 'KakaoSmallFont', -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .sheet {
    max-width: 760px;
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
    padding: 56px 40px 80px;
  }
  header.brief-head {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 36px;
  }
  header.brief-head .kicker {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 4px 10px;
    border-radius: 4px;
    margin: 0 0 14px;
  }
  header.brief-head h1 {
    font-family: 'KakaoBigFont', -apple-system, sans-serif;
    font-size: 30px;
    font-weight: 800;
    margin: 0 0 8px;
    color: var(--ink);
  }
  header.brief-head .date {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
  }
  section.block {
    margin-bottom: 44px;
  }
  section.block h2 {
    font-family: 'KakaoBigFont', -apple-system, sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    margin: 0 0 4px;
  }
  section.block .section-sub {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 18px;
  }
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .row {
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }
  .row:last-child {
    border-bottom: 1px solid var(--line);
  }
  .list--tight .row {
    padding: 10px 0;
  }
  /* 뉴스 "더 보기" 접기 */
  details.more-toggle {
    margin-top: 2px;
  }
  details.more-toggle summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-text);
    padding: 12px 0;
    list-style: none;
  }
  details.more-toggle summary::-webkit-details-marker {
    display: none;
  }
  details.more-toggle summary::after {
    content: ' ▾';
  }
  details.more-toggle[open] summary::after {
    content: ' ▴';
  }
  .row-title {
    display: block;
    font-size: 15.5px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    line-height: 1.4;
  }
  a.row-title:hover {
    color: var(--accent-text);
  }
  .row-desc {
    font-size: 13.5px;
    color: var(--muted);
    margin: 6px 0 0;
    line-height: 1.5;
  }
  .row-meta {
    font-size: 12.5px;
    color: var(--muted);
    margin: 6px 0 0;
  }
  .row-tag {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-text);
    margin: 4px 0 0;
  }
  /* 뉴스 카테고리 탭 */
  .news-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }
  .news-tab {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .news-tab--active {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }
  .tab-count {
    opacity: 0.7;
  }
  .empty {
    font-size: 13.5px;
    color: var(--muted);
    padding: 14px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  /* 달력 */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-grid--header {
    margin-bottom: 6px;
  }
  .cal-dayname {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding-bottom: 4px;
  }
  .cal-day {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--line);
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-day-num {
    font-size: 13px;
    color: var(--text);
  }
  .cal-day--muted .cal-day-num {
    color: var(--line);
  }
  .cal-day--today {
    border-color: var(--ink);
    border-width: 2px;
  }
  .cal-day--flagged {
    border-color: var(--flag);
    border-width: 2px;
    background: #FDECEA;
  }
  .cal-day--flagged .cal-dot {
    background: var(--flag);
  }
  .cal-day--selected {
    background: var(--ink);
  }
  .cal-day--selected .cal-day-num {
    color: var(--paper);
  }
  .cal-dot {
    position: absolute;
    bottom: 5px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  .cal-day--selected .cal-dot {
    background: var(--paper);
  }
  mark.hl {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 0 2px;
    border-radius: 2px;
  }
  .cal-detail {
    margin-top: 20px;
  }
  .cal-detail-date {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 8px;
  }
  /* 일정 상세: 종류별 병행 배치 */
  .cal-kind-columns {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
  }
  .cal-kind-col {
    flex: 1 1 200px;
    min-width: 180px;
  }
  .cal-kind-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 2px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
  }
  .cal-kind-count {
    font-weight: 400;
    color: var(--muted);
  }
  footer.brief-foot {
    margin-top: 56px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>

<script>
  const newsByCategory = {"기타": "<li class=\"row\"><a class=\"row-title\" href=\"https://news.bizwatch.co.kr/article/mobile/2026/09/18/0016\" target=\"_blank\" rel=\"noopener\">&#x27;소액주주 달래기 나선&#x27; 카카오, 바닥 다지고 반등 가능할까</a><p class=\"row-desc\">신설법인 카카오AI는 인공지능(사업)에 집중하고 존속법인 카카오X는 핀테크, 모빌리티, 엔터테인먼트 사업을 주요 사업군으로 삼는다는 계획이다. 특히 카카오는 국내외 증권사가 평가한 부분합산가치(SOTP)는...</p></li><li class=\"row\"><a class=\"row-title\" href=\"https://view.asiae.co.kr/article/2026092115473506891\" target=\"_blank\" rel=\"noopener\">“카카오, 인적분할 불확실성 반영…목표주가 하향”[클릭e종목]</a><p class=\"row-desc\">존속회사인 카카오X는 테크핀·콘텐츠·모빌리티 등 자회사 관리와 신사업 혁신기업 투자를 전담하는 미래가치 투자회사 역할을 맡는다. 2030년 목표 매출은 카카오AI 6조 원, 카카오X 주요 사업 10조 원 이상이다. 이...</p></li><li class=\"row\"><a class=\"row-title\" href=\"https://www.fnnews.com/news/202609211423090158\" target=\"_blank\" rel=\"noopener\">추석 귀성길 막히면 CCTV로 확인…문 여는 병원·공항 대기도 &#x27;한눈에&#x27;[...</a><p class=\"row-desc\">긴 추석 연휴를 앞두고 네이버와 카카오모빌리티가 교통부터 공항·병원·주차·여행까지 연휴에 유용한 기능을 내놓고 있다. 알고 있으면 이번 연휴에 한 번쯤 써먹을 만한 기능들이다. ■내비가 추천한 길...이유까지...</p></li><li class=\"row\"><a class=\"row-title\" href=\"https://www.livebiz.today/news/articleView.html?idxno=205035\" target=\"_blank\" rel=\"noopener\">[생생 모빌리티] 짧아진 추석, 꽉 막힌 도로 피하는 똑똑한 내비 활용법...</a><p class=\"row-desc\">티맵모빌리티에 따르면, 하행선 정체를 피하려면 23일 늦은 밤부터 24일 새벽 사이 출발하는 것이 유리하고... 카카오내비는 최근 개편을 통해 사고나 정체 구간이 발생하면 추천 경로와 함께 &#x27;실시간 최적 경로 추천...</p></li><li class=\"row\"><a class=\"row-title\" href=\"https://www.dnews.co.kr/uhtml/view.jsp?idxno=202609211648435110018\" target=\"_blank\" rel=\"noopener\">카카오, 월 4900원 ‘통합 멤버십’ 출사표… 네이버와 맞대결</a><p class=\"row-desc\">그밖에 멜론, 카카오 페이지, 카카오 모빌리티 등 계열사의 서비스를 활용한 연계 헤택도 네이버플러스 멤버십에 뒤지지 않는 카카오 멤버십의 차별화 요소가 될 수 있다. 한편 카카오멤버십의 구체적인 혜택과 가입 방법...</p></li><li class=\"row\"><a class=\"row-title\" href=\"http://www.biztribune.co.kr/news/articleView.html?idxno=359412\" target=\"_blank\" rel=\"noopener\">카카오모빌리티, 추석 귀성길 지원…내비 CCTV·전기차 렌터카 확대</a><p class=\"row-desc\">출처=카카오모빌리티 카카오모빌리티가 추석 연휴를 앞두고 카카오내비와 카카오 T 렌터카를 활용한 &#x27;스마트·알뜰 이동 팁&#x27;을 21일 공개했다. 교통량이 급증하는 명절 귀성·귀경길에 운전자의 주행 부담을 낮추고...</p></li><li class=\"row\"><a class=\"row-title\" href=\"https://www.newsworks.co.kr/news/articleView.html?idxno=854512\" target=\"_blank\" rel=\"noopener\">[통신 풍향계] SKT &#x27;공공 AI 세미나&#x27;-&#x27;사회적가치 AI 사례&#x27; 전시·KT &#x27;AI 보...</a><p class=\"row-desc\">ITU-T SG17 정보보호 연구반 AI, 신뢰 보안 국제표준화 리더십 강화, KT의 &#x27;2026 KT 보야지 페스티벌&#x27; 10주년... 세미나는 신한카드, 코리아크레딧뷰로(KCB), 카카오모빌리티, SK브로드밴드(SKB)와 함께 운영하는 데이터 협업...</p></li>", "택시·요금": "<li class=\"row\"><a class=\"row-title\" href=\"https://www.businesspost.co.kr/BP?command=article_view&amp;num=446560\" target=\"_blank\" rel=\"noopener\">[Who Is ?] 니콜라 파리 르노코리아 대표이사 사장</a><p class=\"row-desc\">니콜라 파리 르노코리아 대표이사 사장(오른쪽)이 2026년 6월18일 서울 삼성동 코엑스에서 개막한 &#x27;넥스트라이즈 2026&#x27; 내 르노코리아 전시 부스에 마련된 카카오모빌리티 존을 방문해 류긍선 카카오모빌리티...</p></li>", "자율주행": "<li class=\"row\"><a class=\"row-title\" href=\"https://www.joongang.co.kr/article/25463872\" target=\"_blank\" rel=\"noopener\">고객 부모까지 챙긴다…이게 자율주행은 못 주는 ‘대리’ 만족</a><p class=\"row-desc\">1997년 출발한 굿서비스는 티맵모빌리티를 거쳐 지난해 부산에쿼티파트너스(BEP)가 인수했다. 이후 슬로건도... Q : 카카오대리 같은 플랫폼 대리와 가장 큰 차이는. A : 상황실이다. 플랫폼은 알고리즘이 기사를 자동...</p></li><li class=\"row\"><a class=\"row-title\" href=\"https://www.newsworks.co.kr/news/articleView.html?idxno=854363\" target=\"_blank\" rel=\"noopener\">[카카오 3제] 태국-체코 &#x27;카모 노하우에 관심&#x27;·카카오엔터 &#x27;&#x27;수어문화제...</a><p class=\"row-desc\">◆태국-체코 &#x27;카모 노하우에 관심&#x27; 태국과 체코 등이 카카오모빌리티가 축적해 온 자율주행 기술과 서비스 운영 노하우에 관심이 보이고 있다. 시리퐁 앙카사쿨키앗 태국 교통부 차관 등 대표단이 최근 카카오모빌리티는...</p></li><li class=\"row\"><a class=\"row-title\" href=\"https://www.yna.co.kr/view/AKR20260920026500017?input=1195m\" target=\"_blank\" rel=\"noopener\">강남 도심 달리는 카모 자율주행차…해외서 벤치마킹</a><p class=\"row-desc\">태국·체코 교통당국 잇달아 시승…자율주행 서비스 운영 경험 주목 카카오모빌리티는 서울 강남 도심에서 운영하는 자율주행 서비스에 해외 교통 당국의 관심이 이어지고 있다. 20일 카카오모빌리티에 따르면 지난 17일...</p></li>"};
  function showNewsCategory(cat) {
    document.querySelectorAll('.news-tab').forEach(function(b) {
      b.classList.toggle('news-tab--active', b.dataset.cat === cat);
    });
    document.getElementById('news-detail').innerHTML = newsByCategory[cat] || '';
  }
  showNewsCategory('자율주행');
</script>

      <h2>법안 발의 현황</h2>

    <section class="block">

  const highlightKeywords = ["플랫폼", "특고", "노동자", "배달", "카카오", "모빌리티", "자율주행"];

  function escHtml(s) {
    return String(s).replace(/</g, '&lt;');
  }

  function highlightText(s) {
    let out = escHtml(s);
    highlightKeywords.forEach(function(kw) {
      if (!kw) return;
      const escapedKw = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      out = out.replace(new RegExp(escapedKw, 'g'), '<mark class="hl">' + kw + '</mark>');
    });
    return out;
  }

  function eventLine(e) {
    let line = '';
    if (e.time) line += e.time + ' ';
    line += e.content;
    if (e.committee) line += ' (' + e.committee + ')';
    if (e.place) line += ' @ ' + e.place;
    return line;
  }

  function showScheduleDay(dateStr) {
    document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('cal-day--selected'));
    const btn = document.querySelector('.cal-day[data-date="' + dateStr + '"]');
    if (btn) btn.classList.add('cal-day--selected');

    const events = scheduleData[dateStr] || [];
    const detail = document.getElementById('cal-detail');
    const [y, m, d] = dateStr.split('-');
    let html = '<p class="cal-detail-date">' + y + '년 ' + parseInt(m) + '월 ' + parseInt(d) + '일</p>';

    if (events.length === 0) {
      html += '<p class="empty">이 날짜에 예정된 일정이 없습니다.</p>';
    } else {
      // 종류(국회행사/위원회/본회의 등)별로 묶는다
      const groups = {};
      const order = [];
      events.forEach(function(e) {
        const k = e.kind || '일정';
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(e);
      });

      html += '<div class="cal-kind-columns">';
      order.forEach(function(k) {
        html += '<div class="cal-kind-col">';
        html += '<p class="cal-kind-title">' + escHtml(k) + ' <span class="cal-kind-count">' + groups[k].length + '</span></p>';
        html += '<ul class="list list--tight">';
        groups[k].forEach(function(e) {
          html += '<li class="row"><p class="row-desc">' + highlightText(eventLine(e)) + '</p></li>';
        });
        html += '</ul></div>';
      });
      html += '</div>';
    }
    detail.innerHTML = html;
  }
  showScheduleDay('2026-09-22');
