<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대외협력 데일리 브리핑</title>
<style>
  @font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoBigFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoBigSans-ExtraBold.woff2') format('woff2');
    font-weight: 800;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoSmallFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoSmallSans-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'KakaoSmallFont';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2503@1.0/KakaoSmallSans-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  :root {
    --ink: #3E3A39;
    --paper: #FFFFFF;
    --outer: #F4F3F1;
    --accent: #FFCD00;
    --accent-ink: #3E3A39;
    --accent-text: #96730A;
    --flag: #E2574C;
    --text: #3E3A39;
    --muted: #8C8883;
    --line: #EBE9E5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--outer);
    color: var(--text);
    font-family: 'KakaoSmallFont', -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .sheet {
    max-width: 760px;
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
    padding: 56px 40px 80px;
  }
  header.brief-head {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 36px;
  }
  header.brief-head .kicker {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 4px 10px;
    border-radius: 4px;
    margin: 0 0 14px;
  }
  header.brief-head h1 {
    font-family: 'KakaoBigFont', -apple-system, sans-serif;
    font-size: 30px;
    font-weight: 800;
    margin: 0 0 8px;
    color: var(--ink);
  }
  header.brief-head .date {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
  }
  section.block {
    margin-bottom: 44px;
  }
  section.block h2 {
    font-family: 'KakaoBigFont', -apple-system, sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    margin: 0 0 4px;
  }
  section.block .section-sub {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 18px;
  }
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .row {
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }
  .row:last-child {
    border-bottom: 1px solid var(--line);
  }
  .list--tight .row {
    padding: 10px 0;
  }
  /* 뉴스 "더 보기" 접기 */
  details.more-toggle {
    margin-top: 2px;
  }
  details.more-toggle summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-text);
    padding: 12px 0;
    list-style: none;
  }
  details.more-toggle summary::-webkit-details-marker {
    display: none;
  }
  details.more-toggle summary::after {
    content: ' ▾';
  }
  details.more-toggle[open] summary::after {
    content: ' ▴';
  }
  .row-title {
    display: block;
    font-size: 15.5px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    line-height: 1.4;
  }
  a.row-title:hover {
    color: var(--accent-text);
  }
  .row-desc {
    font-size: 13.5px;
    color: var(--muted);
    margin: 6px 0 0;
    line-height: 1.5;
  }
  .row-meta {
    font-size: 12.5px;
    color: var(--muted);
    margin: 6px 0 0;
  }
  .row-tag {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-text);
    margin: 4px 0 0;
  }
  /* 뉴스 카테고리 탭 */
  .news-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }
  .news-tab {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .news-tab--active {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }
  .tab-count {
    opacity: 0.7;
  }
  .empty {
    font-size: 13.5px;
    color: var(--muted);
    padding: 14px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  /* 달력 */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-grid--header {
    margin-bottom: 6px;
  }
  .cal-dayname {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding-bottom: 4px;
  }
  .cal-day {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--line);
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-day-num {
    font-size: 13px;
    color: var(--text);
  }
  .cal-day--muted .cal-day-num {
    color: var(--line);
  }
  .cal-day--today {
    border-color: var(--ink);
    border-width: 2px;
  }
  .cal-day--flagged {
    border-color: var(--flag);
    border-width: 2px;
    background: #FDECEA;
  }
  .cal-day--flagged .cal-dot {
    background: var(--flag);
  }
  .cal-day--selected {
    background: var(--ink);
  }
  .cal-day--selected .cal-day-num {
    color: var(--paper);
  }
  .cal-dot {
    position: absolute;
    bottom: 5px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  .cal-day--selected .cal-dot {
    background: var(--paper);
  }
  mark.hl {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 0 2px;
    border-radius: 2px;
  }
  .cal-detail {
    margin-top: 20px;
  }
  .cal-detail-date {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 8px;
  }
  /* 일정 상세: 종류별 병행 배치 */
  .cal-kind-columns {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
  }
  .cal-kind-col {
    flex: 1 1 200px;
    min-width: 180px;
  }
  .cal-kind-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 2px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
  }
  .cal-kind-count {
    font-weight: 400;
    color: var(--muted);
  }
  footer.brief-foot {
    margin-top: 56px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

부 장관상</a><p class=\"row-desc\">카카오모빌리티의 자동차 검사 예약 서비스 [사진=카카오모빌리티] 카카오모빌리티는 카카오 T와 카카오내비의 자동차 검사 예약 서비스로 &#x27;2026년 디지털서비스 개방 성과공유회&#x27;에서 최고상인 행정안전부 장관상을...</p></li><li class=\"row\"><a class=\"row-title\" href=\"http://www.kdfnews.com/news/articleView.html?idxno=190180\" target=\"_blank\" rel=\"noopener\">카카오모빌리티, 자동차 검사 예약 서비스로 행안부 장관상</a><p class=\"row-desc\">카카오모빌리티는 2023년 6월 참여사로 선정된 이후 한국교통안전공단과 협력해 &#x27;카카오 T&#x27;와 &#x27;카카오내비&#x27;에서 자동차 검사 예약 서비스를 제공해왔다. 이용자는 앱에 차량을 등록하면 검사 대상 여부 확인부터 검사소...</p></li><li class=\"row\"><a class=\"row-title\" href=\"https://www.newsworks.co.kr/news/articleView.html?idxno=901372\" target=\"_blank\" rel=\"noopener\">[IT라운지] &#x27;갤럭시 Z폴드8&#x27; 쇼핑 라이브·&#x27;크리젠랩&#x27; 매출 급증·카모 &#x27;...</a><p class=\"row-desc\">브이캣의 &#x27;크리젠 랩&#x27; 올 매출이 지난해 연간 매출보다 343% 늘었고 카카오모빌리티가 행정안전부 장관상을... ◆카모 &#x27;행안부장관상&#x27; 카카오모빌리티가 행정안전부 장관상을 받는다. 디지털서비스 개방은 공공서비스를...</p></li>", "IPO·상장": "<li class=\"row\"><a class=\"row-title\" href=\"https://www.mk.co.kr/article/12191280\" target=\"_blank\" rel=\"noopener\">회장님 제안으로 출발해 1등앱 된 ‘티맵’…SK가 손절 나선 배경은?</a><p class=\"row-desc\">경쟁사 카카오모빌리티가 대표적이다. 지난해 1000억원이 넘는 영업이익을 올린 ‘돈 버는’ 플랫폼이지만 상장 문턱을 넘지 못하고 있다. FI 회수를 위해 이들 지분을 미국 증시에 ADR로 상장하는 방안을 추진했지만...</p></li>", "자율주행": "<li class=\"row\"><a class=\"row-title\" href=\"http://www.choicenews.co.kr/news/articleView.html?idxno=172752\" target=\"_blank\" rel=\"noopener\">현대차그룹, 아파트 주차로봇 실증…성과는?, 기대 효과는?</a><p class=\"row-desc\">HL만도는 2024년 5월 카카오모빌리티, 케이엠파킹앤스페이스와 자율주행 주차로봇 서비스 상용화를 위한 업무협약을 체결했다. 주차로봇 파키를 활용해 로봇 기술과 주차 관제·운영 서비스를 결합하려는 시도다. 같은 해...</p></li>", "택시·요금": "<li class=\"row\"><a class=\"row-title\" href=\"https://www.naeil.com/news/read/606725?ref=naver\" target=\"_blank\" rel=\"noopener\">카카오모빌리티 ‘경쟁 콜 차단’ 증인신문 본격화</a><p class=\"row-desc\">카카오모빌리티(카모) 대표와 부사장 등 임직원 3명과 법인에 대한 공판기일을 열고 향후 증인신문 일정 등을 확인했다. 앞서 공소청은 카모가 2021년 2월부터 2023년 12월까지 일반호출 시장의 시장지배적 지위를 남용해...</p></li>", "플랫폼 노동": "<li class=\"row\"><a class=\"row-title\" href=\"https://biz.heraldcorp.com/article/10915086?ref=naver\" target=\"_blank\" rel=\"noopener\">‘카카오모빌리티-택시노조’ 직접 교섭 불발…노란봉투법 분쟁 본격</a><p class=\"row-desc\">배차 알고리즘 근거로 원청교섭 요구…카모 미공고 택시 업계, 노동위 시정신청 예고…법적 분쟁 불가피 네카오 통합교섭 이어 모빌리티로…플랫폼 업계 촉각 [헤럴드경제=차민주·정경수 기자] 노란봉투법 분쟁이...</p></li>"};
  function showNewsCategory(cat) {
    document.querySelectorAll('.news-tab').forEach(function(b) {
      b.classList.toggle('news-tab--active', b.dataset.cat === cat);
    });
    document.getElementById('news-detail').innerHTML = newsByCategory[cat] || '';
  }
  showNewsCategory('자율주행');
</script>

    <section class="block">
      <h2>법안 발의 현황</h2>

 "국회행사", "time": "07:30~09:00", "content": "농지전수조사, 진단과 과제", "committee": "", "place": "의원회관 제6간담회의실(209호)"}]};
  const highlightKeywords = ["플랫폼", "특고", "노동자", "배달", "카카오", "모빌리티", "자율주행"];

  function escHtml(s) {
    return String(s).replace(/</g, '&lt;');
  }

  function highlightText(s) {
    let out = escHtml(s);
    highlightKeywords.forEach(function(kw) {
      if (!kw) return;
      const escapedKw = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      out = out.replace(new RegExp(escapedKw, 'g'), '<mark class="hl">' + kw + '</mark>');
    });
    return out;
  }

  function eventLine(e) {
    let line = '';
    if (e.time) line += e.time + ' ';
    line += e.content;
    if (e.committee) line += ' (' + e.committee + ')';
    if (e.place) line += ' @ ' + e.place;
    return line;
  }

  function showScheduleDay(dateStr) {
    document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('cal-day--selected'));
    const btn = document.querySelector('.cal-day[data-date="' + dateStr + '"]');
    if (btn) btn.classList.add('cal-day--selected');

    const events = scheduleData[dateStr] || [];
    const detail = document.getElementById('cal-detail');
    const [y, m, d] = dateStr.split('-');
    let html = '<p class="cal-detail-date">' + y + '년 ' + parseInt(m) + '월 ' + parseInt(d) + '일</p>';

    if (events.length === 0) {
      html += '<p class="empty">이 날짜에 예정된 일정이 없습니다.</p>';
    } else {
      // 종류(국회행사/위원회/본회의 등)별로 묶는다
      const groups = {};
      const order = [];
      events.forEach(function(e) {
        const k = e.kind || '일정';
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(e);
      });

      html += '<div class="cal-kind-columns">';
      order.forEach(function(k) {
        html += '<div class="cal-kind-col">';
        html += '<p class="cal-kind-title">' + escHtml(k) + ' <span class="cal-kind-count">' + groups[k].length + '</span></p>';
        html += '<ul class="list list--tight">';
        groups[k].forEach(function(e) {
          html += '<li class="row"><p class="row-desc">' + highlightText(eventLine(e)) + '</p></li>';
        });
        html += '</ul></div>';
      });
      html += '</div>';
    }
    detail.innerHTML = html;
  }
  showScheduleDay('2026-10-30');
