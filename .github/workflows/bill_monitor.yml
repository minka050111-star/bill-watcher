name: Bill Monitor

# 언제 실행할지 설정
on:
  schedule:
    # 한국시간(KST) 오전 9시~오후 6시, 매시간 정각 실행
    # (UTC 기준 0~9시 = KST 9~18시. KST는 UTC+9시간입니다)
    - cron: '0 0-9 * * *'
  workflow_dispatch: {}  # Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

# 이전 실행이 아직 끝나지 않았으면 새로 실행하지 않고 기다리게 함
# (동시에 두 번 실행돼서 git push가 충돌하는 것을 방지)
concurrency:
  group: bill-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # seen_bills.json 을 다시 커밋하기 위해 필요
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 법안 모니터링 스크립트 실행
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bill_monitor.py

      - name: 중복 알림 방지 기록 저장 (seen_bills.json 커밋)
        run: |
          git config --global user.name "bill-monitor-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add seen_bills.json
          if ! git diff --staged --quiet; then
            git commit -m "update seen_bills.json [skip ci]"
            # 그 사이 원격에 다른 변경사항이 생겼을 수 있으니 먼저 받아온 뒤 push
            git pull --rebase origin main
            git push
          else
            echo "변경 사항 없음 - 커밋/푸시 생략"
          fi
