name: Bill Monitor

# 언제 실행할지 설정
on:
  schedule:
    # UTC 기준 0시 = 한국시간(KST) 오전 9시. 시간을 바꾸고 싶으면 이 값을 수정하세요.
    - cron: '0 0 * * *'
  workflow_dispatch: {}  # Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # seen_bills.json 을 다시 커밋하기 위해 필요
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 법안 모니터링 스크립트 실행
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bill_monitor.py

      - name: 중복 알림 방지 기록 저장 (seen_bills.json 커밋)
        run: |
          git config --global user.name "bill-monitor-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add seen_bills.json
          git diff --staged --quiet || git commit -m "update seen_bills.json [skip ci]"
          git push
