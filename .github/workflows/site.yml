name: Daily Briefing Site

on:
  schedule:
    # 한국시간(KST) 오전 8시에 실행 (UTC 기준 전날 23시)
    - cron: '0 23 * * *'
  workflow_dispatch: {}  # Actions 탭에서 수동 실행도 가능

concurrency:
  group: daily-briefing-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install requests

      - name: 사이트 생성 (docs/index.html)
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SCHEDULE_API_URL: ${{ secrets.SCHEDULE_API_URL }}
        run: python generate_site.py

      - name: 생성된 사이트 커밋 및 푸시
        run: |
          git config --global user.name "briefing-site-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --staged --quiet; then
            git commit -m "update daily briefing site [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "변경 사항 없음 - 커밋/푸시 생략"
          fi
